name: Publish verified Windows release
on:
  push:
    branches: [main]
    paths: ['distribution/**', 'release.json', 'scripts/**', '.github/workflows/publish-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py
      - name: Publish release attachments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(python -c "import json; print(json.load(open('release.json'))['tag'])")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Cursed Words 繁體中文化與離線辭典 $TAG" --notes-file RELEASE_NOTES.md
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          gh release delete-asset "$TAG" CursedWords_.exe --yes >/dev/null 2>&1 || true
          gh release upload "$TAG" dist/release/* --clobber
